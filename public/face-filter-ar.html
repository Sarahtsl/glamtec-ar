<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Filter AR 3D — GlamTec</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Three.js r128 + GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #08080f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    header .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #8b7cf8;
      box-shadow: 0 0 8px #8b7cf8;
    }

    /* ─── Overlay de chargement global ─────────────── */
    #preload-overlay {
      position: fixed;
      inset: 0;
      background: #08080f;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity .6s ease;
    }
    #preload-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .preload-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .preload-logo .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #8b7cf8;
      box-shadow: 0 0 12px #8b7cf8;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .preload-logo .dot:nth-child(2) { animation-delay: .2s; }
    .preload-logo h2 {
      font-size: 18px;
      font-weight: 300;
      color: rgba(255,255,255,0.6);
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    @keyframes dotPulse {
      0%,100% { opacity: .3; transform: scale(.8); }
      50%      { opacity: 1;  transform: scale(1.3); }
    }

    .preload-bar-wrap {
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .preload-bar-bg {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .preload-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6c63d9, #b09eff);
      border-radius: 3px;
      transition: width .35s ease;
      box-shadow: 0 0 8px rgba(139,124,248,.6);
    }
    .preload-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preload-model-name {
      font-size: 12px;
      color: rgba(255,255,255,.35);
      letter-spacing: .06em;
    }
    .preload-pct {
      font-size: 13px;
      font-weight: 600;
      color: #8b7cf8;
      font-variant-numeric: tabular-nums;
    }

    .preload-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 340px;
    }
    .preload-chip {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      border: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.2);
      transition: all .3s;
    }
    .preload-chip.done {
      border-color: rgba(139,124,248,.4);
      color: #b09eff;
      background: rgba(139,124,248,.08);
    }

    /* ─── Stage ─────────────────────────────────── */
    #stage {
      position: relative;
      width: 640px; height: 480px;
      border-radius: 20px;
      overflow: hidden;
      background: #111;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.06),
        0 32px 80px rgba(0,0,0,.8);
    }

    #inputVideo {
      position: absolute; width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #threeCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    #debugCanvas {
      position: absolute; width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s;
    }

    #status {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 12px;
      padding: 5px 16px;
      border-radius: 20px;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity .5s;
      border: 1px solid rgba(255,255,255,.08);
    }

    /* ─── Contrôles filtres ───────────────────────── */
    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 640px;
    }

    .filter-btn {
      position: relative;
      padding: 10px 22px;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.50);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-btn:hover:not(:disabled) {
      background: rgba(255,255,255,.09);
      color: #fff;
      border-color: rgba(255,255,255,.15);
    }
    .filter-btn.active {
      border-color: #8b7cf8;
      background: rgba(139,124,248,.15);
      color: #fff;
    }
    /* Bouton désactivé = modèle pas encore chargé */
    .filter-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    /* Indicateur prêt (petit check vert) */
    .filter-btn .ready-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      opacity: 0;
      box-shadow: 0 0 5px #4ade80;
      transition: opacity .4s;
      flex-shrink: 0;
    }
    .filter-btn.model-ready .ready-dot {
      opacity: 1;
    }

    /* ─── Sliders de calibration ─────────────────── */
    #calibration {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 640px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 14px;
      padding: 16px 20px;
    }
    #calibration summary {
      font-size: 12px;
      color: rgba(255,255,255,.35);
      cursor: pointer;
      letter-spacing: .08em;
      text-transform: uppercase;
      user-select: none;
    }
    #calibration summary:hover { color: rgba(255,255,255,.6); }
    .cal-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }
    .cal-row label {
      font-size: 12px;
      color: rgba(255,255,255,.4);
      width: 100px;
    }
    .cal-row input[type=range] {
      flex: 1;
      accent-color: #8b7cf8;
    }
    .cal-row span {
      font-size: 12px;
      color: rgba(255,255,255,.45);
      width: 44px;
      text-align: right;
    }

    #hint {
      font-size: 11px;
      color: rgba(255,255,255,.18);
    }
    kbd {
      background: rgba(255,255,255,.08);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
    }
  </style>
</head>
<body>

<!-- ═══ OVERLAY PRÉCHARGEMENT ═══════════════════════ -->
<div id="preload-overlay">
  <div class="preload-logo">
    <div class="dot"></div>
    <h2>GlamTec AR</h2>
    <div class="dot"></div>
  </div>

  <div class="preload-bar-wrap">
    <div class="preload-info">
      <span class="preload-model-name" id="preload-model-name">Initialisation…</span>
      <span class="preload-pct" id="preload-pct">0%</span>
    </div>
    <div class="preload-bar-bg">
      <div class="preload-bar-fill" id="preload-bar"></div>
    </div>
  </div>

  <div class="preload-list" id="preload-chips"></div>
</div>
<!-- ════════════════════════════════════════════════ -->

<header>
  <div class="dot"></div>
  <h1>GlamTec — Face Filter AR 3D</h1>
  <div class="dot"></div>
</header>

<div id="stage">
  <video id="inputVideo" autoplay muted playsinline></video>
  <canvas id="threeCanvas"></canvas>
  <canvas id="debugCanvas" width="640" height="480"></canvas>
  <div id="status">Initialisation…</div>
</div>

<div id="controls">
  <button class="filter-btn active" data-filter="glasses" disabled>
    <span>👓</span> Classiques
    <span class="ready-dot"></span>
  </button>
  <button class="filter-btn" data-filter="pink_round_sunglasses" disabled>
    <span>🕶</span> Solaires
    <span class="ready-dot"></span>
  </button>
  <button class="filter-btn" data-filter="black_glasses" disabled>
    <span>👓</span> Noires
    <span class="ready-dot"></span>
  </button>
  <button class="filter-btn" data-filter="balenciaga_sunglasses" disabled>
    <span>🕶</span> Balenciaga
    <span class="ready-dot"></span>
  </button>
  <button class="filter-btn" data-filter="prada_vintage_star_glasses" disabled>
    <span>👓</span> Prada
    <span class="ready-dot"></span>
  </button>
  <button class="filter-btn" data-filter="white_sunglasses" disabled>
    <span>🕶</span> Blanches
    <span class="ready-dot"></span>
  </button>
  <button class="filter-btn model-ready" data-filter="none">
    <span>✕</span> Aucun
    <span class="ready-dot"></span>
  </button>
</div>

<details id="calibration">
  <summary>⚙ Calibration — <span id="cal-model-label">Classiques</span></summary>
  <div class="cal-row">
    <label>Échelle</label>
    <input type="range" id="cal-scale" min="-10.0" max="10.0" step="0.05" value="1.0">
    <span id="val-scale">1.00</span>
  </div>
  <div class="cal-row">
    <label>Offset Y</label>
    <input type="range" id="cal-offsetY" min="-0.3" max="0.3" step="0.005" value="0">
    <span id="val-offsetY">0.00</span>
  </div>
  <div class="cal-row">
    <label>Offset Z</label>
    <input type="range" id="cal-offsetZ" min="-0.5" max="0.5" step="0.01" value="0">
    <span id="val-offsetZ">0.00</span>
  </div>
  <div class="cal-row">
    <label>Rotation X</label>
    <input type="range" id="cal-rotX" min="-0.5" max="0.5" step="0.01" value="0">
    <span id="val-rotX">0.00</span>
  </div>
  <div class="cal-row">
    <label>Retourner (flipY)</label>
    <label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer">
      <input type="checkbox" id="cal-flipY" style="accent-color:#8b7cf8;width:16px;height:16px">
      <span style="font-size:12px;color:rgba(255,255,255,.4)">Face opposée → cocher pour retourner</span>
    </label>
    <span style="width:44px"></span>
  </div>
  <div class="cal-row" style="margin-top:8px;border-top:1px solid rgba(255,255,255,.06);padding-top:10px">
    <label style="color:rgba(255,255,255,.25)">Sauvegarder</label>
    <button id="btn-copy-cal" style="flex:1;padding:6px 14px;background:rgba(139,124,248,.15);border:1px solid rgba(139,124,248,.3);color:#c4bbff;border-radius:8px;font-size:12px;cursor:pointer">
      📋 Copier les valeurs dans le code
    </button>
    <span style="width:44px"></span>
  </div>
  <pre id="cal-output" style="display:none;margin-top:8px;padding:10px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:8px;font-size:11px;color:#a0e0b0;line-height:1.6;overflow:auto"></pre>
</details>

<p id="hint">Touche <kbd>D</kbd> debug landmarks · <kbd>R</kbd> reset calibration</p>

<script>
/* ═══════════════════════════════════════════════════════
   CONSTANTES
═══════════════════════════════════════════════════════ */
const W = 640, H = 480;

const LM = {
  R_EYE_OUT: 33,  R_EYE_IN: 133,
  L_EYE_OUT: 263, L_EYE_IN: 362,
  NOSE_TIP:  4,
  R_EAR:     234, L_EAR: 454,
};

const MODEL_CONFIG = {
  glasses: {
    path: 'models/glasses.glb', label: 'Classiques',
    scale: 0.80, offsetY: -0.010, offsetZ: 0.000, rotX: 0.000, flipY: true,
  },
  pink_round_sunglasses: {
    path: 'models/pink_round_sunglasses.glb', label: 'Solaires',
    scale: 0.90, offsetY: -0.090, offsetZ: 0.150, rotX: -0.160, flipY: true,
  },
  black_glasses: {
    path: 'models/black_glasses.glb', label: 'Noires',
    scale: 0.60, offsetY: -0.015, offsetZ: 0.000, rotX: 0.000, flipY: true,
  },
  balenciaga_sunglasses: {
    path: 'models/balenciaga_sunglasses.glb', label: 'Balenciaga',
    scale: 6.80, offsetY: 0.020, offsetZ: 0.000, rotX: 0.190, flipY: false,
  },
  prada_vintage_star_glasses: {
    path: 'models/prada_vintage_star_glasses.glb', label: 'Prada',
    scale: 0.40, offsetY: -0.010, offsetZ: 0.050, rotX: 0.050, flipY: true,
  },
  white_sunglasses: {
    path: 'models/white_sunglasses.glb', label: 'Blanches',
    scale: 1.00, offsetY: -0.125, offsetZ: 0.000, rotX: -0.160, flipY: true,
  },
};

/* ═══════════════════════════════════════════════════════
   CALIBRATION
═══════════════════════════════════════════════════════ */
let CAL = MODEL_CONFIG['glasses'];

window.addEventListener('DOMContentLoaded', () => { syncSlidersToCAL && syncSlidersToCAL(); });

/* ═══════════════════════════════════════════════════════
   ÉTAT
═══════════════════════════════════════════════════════ */
const video    = document.getElementById('inputVideo');
const dbgCvs   = document.getElementById('debugCanvas');
const dctx     = dbgCvs.getContext('2d');
const statusEl = document.getElementById('status');

let currentFilter = 'glasses';
let debugMode     = false;
const modelCache  = {};
let activeModel   = null;

/* ═══════════════════════════════════════════════════════
   THREE.JS SETUP
═══════════════════════════════════════════════════════ */
const threeCanvas = document.getElementById('threeCanvas');
threeCanvas.width  = W;
threeCanvas.height = H;

const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const halfW  = 1.0;
const halfH  = halfW * (H / W);
const camera = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.01, 100);
camera.position.set(0, 0, 5);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(0, 2, 4);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.5);
fillLight.position.set(-2, -1, 2);
scene.add(fillLight);

/* ═══════════════════════════════════════════════════════
   PRÉCHARGEMENT DE TOUS LES MODÈLES AU DÉMARRAGE
═══════════════════════════════════════════════════════ */
const gltfLoader = new THREE.GLTFLoader();

// Construire les chips dans l'overlay
const chipsContainer = document.getElementById('preload-chips');
const filterKeys = Object.keys(MODEL_CONFIG);
const chipEls = {};
filterKeys.forEach(key => {
  const chip = document.createElement('div');
  chip.className = 'preload-chip';
  chip.textContent = MODEL_CONFIG[key].label;
  chip.id = 'chip-' + key;
  chipsContainer.appendChild(chip);
  chipEls[key] = chip;
});

const barFill    = document.getElementById('preload-bar');
const pctLabel   = document.getElementById('preload-pct');
const modelLabel = document.getElementById('preload-model-name');
const overlay    = document.getElementById('preload-overlay');

let loadedCount = 0;
const total = filterKeys.length;

/**
 * Charge un modèle GLB en arrière-plan, met à jour la barre de progression.
 * Retourne une Promise qui se résout toujours (même en cas d'erreur).
 */
function preloadModel(filterName) {
  return new Promise((resolve) => {
    const cfg = MODEL_CONFIG[filterName];
    modelLabel.textContent = `Chargement : ${cfg.label}…`;

    gltfLoader.load(
      cfg.path,
      (gltf) => {
        const model = gltf.scene;

        // Centrer + normaliser
        const box = new THREE.Box3().setFromObject(model);
        const center = new THREE.Vector3();
        box.getCenter(center);
        model.position.sub(center);
        const size = new THREE.Vector3();
        box.getSize(size);
        model.scale.setScalar(1.0 / size.x);
        model.rotation.x = Math.PI;
        model.visible = false;
        scene.add(model);
        modelCache[filterName] = model;

        // Marquer le bouton et le chip comme prêts
        const btn = document.querySelector(`[data-filter="${filterName}"]`);
        if (btn) {
          btn.removeAttribute('disabled');
          btn.classList.add('model-ready');
        }
        chipEls[filterName]?.classList.add('done');

        loadedCount++;
        const pct = Math.round((loadedCount / total) * 100);
        barFill.style.width = pct + '%';
        pctLabel.textContent = pct + '%';

        // Dès le 1er modèle prêt : on peut déjà activer la caméra/app
        if (loadedCount === 1 && filterName === 'glasses') {
          model.visible = true;
          activeModel = model;
        }

        // Tous chargés → cacher l'overlay après un court délai
        if (loadedCount === total) {
          modelLabel.textContent = '✓ Tous les modèles sont prêts !';
          setTimeout(() => {
            overlay.classList.add('hidden');
            setStatus('✓ Prêt', 2000);
          }, 600);
        }

        resolve();
      },
      (xhr) => {
        // Progression interne à ce fichier (optionnel, on affiche juste le compte global)
        if (xhr.total > 0) {
          const filePct = Math.round(xhr.loaded / xhr.total * 100);
          modelLabel.textContent = `${cfg.label}… ${filePct}%`;
        }
      },
      (err) => {
        console.warn('Modèle introuvable :', cfg.path, err);
        // On considère ce modèle comme "chargé" (avec erreur) pour ne pas bloquer la progression
        loadedCount++;
        const pct = Math.round((loadedCount / total) * 100);
        barFill.style.width = pct + '%';
        pctLabel.textContent = pct + '%';
        chipEls[filterName] && (chipEls[filterName].style.opacity = '.25');
        if (loadedCount === total) {
          modelLabel.textContent = 'Chargement terminé (certains modèles manquants)';
          setTimeout(() => overlay.classList.add('hidden'), 600);
        }
        resolve(); // on ne rejette pas pour ne pas bloquer Promise.all
      }
    );
  });
}

/**
 * Lance le préchargement séquentiel de tous les modèles.
 * Séquentiel (au lieu de Promise.all) pour éviter de saturer la bande passante.
 */
async function preloadAllModels() {
  for (const key of filterKeys) {
    await preloadModel(key);
  }
}

/* ═══════════════════════════════════════════════════════
   SWITCH MODÈLE (instantané car tout est déjà en cache)
═══════════════════════════════════════════════════════ */
function switchModel(filterName) {
  if (activeModel) activeModel.visible = false;
  if (filterName === 'none') { activeModel = null; return; }

  if (MODEL_CONFIG[filterName]) {
    CAL = MODEL_CONFIG[filterName];
    syncSlidersToCAL();
  }

  const model = modelCache[filterName];
  if (model) {
    model.visible = true;
    activeModel   = model;
  }
  // Si le modèle n'est pas encore en cache (rare), on attend
  // mais grâce au préchargement ce cas ne devrait pas arriver
}

function syncSlidersToCAL() {
  const s = (id, val, dec) => {
    const el = document.getElementById('cal-' + id);
    const lb = document.getElementById('val-' + id);
    if (el) el.value = val;
    if (lb) lb.textContent = val.toFixed(dec);
  };
  s('scale',   CAL.scale,   2);
  s('offsetY', CAL.offsetY, 2);
  s('offsetZ', CAL.offsetZ, 2);
  s('rotX',    CAL.rotX,    2);
  const flipEl = document.getElementById('cal-flipY');
  if (flipEl) flipEl.checked = CAL.flipY;
}

/* ═══════════════════════════════════════════════════════
   GÉOMÉTRIE
═══════════════════════════════════════════════════════ */
const mid  = (a, b) => ({ x:(a.x+b.x)/2, y:(a.y+b.y)/2, z:(a.z+b.z)/2 });
const dist = (a, b) => Math.hypot(a.x-b.x, a.y-b.y);
const px   = l => ({ x:(1-l.x)*W, y:l.y*H, z:l.z });

function screenToWorld(sx, sy) {
  return {
    x:  (sx / W) * 2*halfW - halfW,
    y: -(sy / H) * 2*halfH + halfH,
  };
}

/* ═══════════════════════════════════════════════════════
   MEDIAPIPE CALLBACK
═══════════════════════════════════════════════════════ */
function onResults(results) {
  dctx.clearRect(0, 0, W, H);
  if (!results.multiFaceLandmarks?.length) {
    renderer.render(scene, camera);
    return;
  }

  const lm = results.multiFaceLandmarks[0];
  const rEyePx = mid(px(lm[LM.R_EYE_OUT]), px(lm[LM.R_EYE_IN]));
  const lEyePx = mid(px(lm[LM.L_EYE_OUT]), px(lm[LM.L_EYE_IN]));
  const nosePx = px(lm[LM.NOSE_TIP]);
  const rEarPx = px(lm[LM.R_EAR]);
  const lEarPx = px(lm[LM.L_EAR]);
  const ctrPx  = mid(rEyePx, lEyePx);

  const earSpanPx = dist(rEarPx, lEarPx);
  const rollAngle = Math.atan2(lEyePx.y - rEyePx.y, lEyePx.x - rEyePx.x);
  const rEarZ = lm[LM.R_EAR].z;
  const lEarZ = lm[LM.L_EAR].z;
  const yawAngle = (rEarZ - lEarZ) * 2.5;
  const depthZ = lm[LM.NOSE_TIP].z;

  if (activeModel) {
    const wPos = screenToWorld(ctrPx.x, ctrPx.y);
    const earSpanWorld = (earSpanPx / W) * 2 * halfW;
    const finalScale   = earSpanWorld * CAL.scale;

    activeModel.position.set(wPos.x, wPos.y + CAL.offsetY, CAL.offsetZ - depthZ * 0.5);
    activeModel.scale.setScalar(finalScale);

    const flipY = CAL.flipY ? Math.PI : 0;
    activeModel.rotation.order = 'YXZ';
    activeModel.rotation.y = flipY + yawAngle;
    activeModel.rotation.x = Math.PI + CAL.rotX;
    activeModel.rotation.z = -rollAngle;
  }

  renderer.render(scene, camera);

  if (debugMode) {
    for (const l of lm) {
      dctx.beginPath();
      dctx.arc((1-l.x)*W, l.y*H, 1.2, 0, Math.PI*2);
      dctx.fillStyle = 'rgba(139,124,248,.45)';
      dctx.fill();
    }
    dbgPt(rEyePx, '#0ff', 'œil D');
    dbgPt(lEyePx, '#0ff', 'œil G');
    dbgPt(nosePx, '#f0f', 'nez');
    dbgPt(ctrPx,  '#ff0', 'centre');
    dbgPt(rEarPx, '#f90', 'oreille D');
    dbgPt(lEarPx, '#f90', 'oreille G');
  }
}

/* ═══════════════════════════════════════════════════════
   MEDIAPIPE INIT + DÉMARRAGE PRÉCHARGEMENT EN PARALLÈLE
═══════════════════════════════════════════════════════ */
const faceMesh = new FaceMesh({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
});
faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence:  0.5,
});
faceMesh.onResults(onResults);

// Caméra et préchargement lancés en parallèle
const cam = new Camera(video, {
  onFrame: async () => { await faceMesh.send({ image: video }); },
  width: W, height: H,
});

// Lancer les deux en parallèle : caméra ET préchargement
Promise.all([
  cam.start().catch(e => setStatus('Erreur caméra : ' + e.message)),
  preloadAllModels(),
]);

/* ═══════════════════════════════════════════════════════
   UI — BOUTONS
═══════════════════════════════════════════════════════ */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    switchModel(currentFilter);
    updateCalLabel();
  });
});

/* ═══════════════════════════════════════════════════════
   UI — SLIDERS
═══════════════════════════════════════════════════════ */
function bindSlider(id, key, decimals = 2) {
  const slider = document.getElementById(id);
  const label  = document.getElementById('val-' + id.replace('cal-', ''));
  slider.addEventListener('input', () => {
    CAL[key] = parseFloat(slider.value);
    if (label) label.textContent = CAL[key].toFixed(decimals);
  });
}
bindSlider('cal-scale',   'scale',   2);
bindSlider('cal-offsetY', 'offsetY', 2);
bindSlider('cal-offsetZ', 'offsetZ', 2);
bindSlider('cal-rotX',    'rotX',    2);

document.getElementById('cal-flipY').addEventListener('change', e => { CAL.flipY = e.target.checked; });

function updateCalLabel() {
  const lbl = document.getElementById('cal-model-label');
  if (lbl && MODEL_CONFIG[currentFilter]) lbl.textContent = MODEL_CONFIG[currentFilter].label;
}

document.getElementById('btn-copy-cal').addEventListener('click', () => {
  const lines = Object.entries(MODEL_CONFIG).map(([k, v]) =>
    `  ${k}: {\n    path: '${v.path}', label: '${v.label}',\n    scale: ${v.scale.toFixed(2)}, offsetY: ${v.offsetY.toFixed(3)}, offsetZ: ${v.offsetZ.toFixed(3)}, rotX: ${v.rotX.toFixed(3)}, flipY: ${v.flipY},\n  },`
  ).join('\n');
  const output = `const MODEL_CONFIG = {\n${lines}\n};`;
  const pre = document.getElementById('cal-output');
  pre.textContent = output;
  pre.style.display = 'block';
  navigator.clipboard?.writeText(output).then(() => {
    document.getElementById('btn-copy-cal').textContent = '✓ Copié !';
    setTimeout(() => { document.getElementById('btn-copy-cal').textContent = '📋 Copier les valeurs dans le code'; }, 2500);
  });
});

/* ═══════════════════════════════════════════════════════
   CLAVIER
═══════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'd') { debugMode = !debugMode; dbgCvs.style.opacity = debugMode ? '1' : '0'; }
  if (k === 'r') { CAL.scale=1; CAL.offsetY=0; CAL.offsetZ=0; CAL.rotX=0; CAL.flipY=false; syncSlidersToCAL(); }
});

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
function setStatus(msg, hideAfter) {
  statusEl.textContent = msg;
  statusEl.style.opacity = '1';
  if (hideAfter) setTimeout(() => statusEl.style.opacity = '0', hideAfter);
}
function dbgPt(p, c, label) {
  dctx.beginPath();
  dctx.arc(p.x, p.y, 5, 0, Math.PI*2);
  dctx.fillStyle = c;
  dctx.fill();
  dctx.font = '11px monospace';
  dctx.fillStyle = c;
  dctx.fillText(label, p.x+8, p.y-3);
}
</script>
