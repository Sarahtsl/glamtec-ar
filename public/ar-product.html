<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AR Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono&display=swap');
    * { margin:0;padding:0;box-sizing:border-box; }
    :root { --accent:#7c6dfa; --accentB:#fa6d9f; --bg:#07080f; --text:#eeeef5; --muted:rgba(255,255,255,0.45); }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; overflow:hidden; }
    .topbar { position:fixed; top:0;left:0;right:0; z-index:20; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:rgba(7,8,15,0.85); backdrop-filter:blur(16px); border-bottom:1px solid rgba(255,255,255,0.06); }
    .topbar-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; background:linear-gradient(135deg,var(--accent),var(--accentB)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .topbar-name { font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    model-viewer { width:100vw; height:100vh; background:radial-gradient(ellipse at 50% 40%,#1a1830 0%,#07080f 70%); }
    .ar-btn { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); padding:16px 40px; background:linear-gradient(135deg,var(--accent),var(--accentB)); border:none; border-radius:60px; font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; color:#fff; cursor:pointer; letter-spacing:0.5px; box-shadow:0 8px 40px rgba(124,109,250,0.45); display:flex; align-items:center; gap:10px; white-space:nowrap; animation:floatBtn 3s ease-in-out infinite; }
    @keyframes floatBtn { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-6px)} }
    #loadingOverlay { position:fixed; inset:0; background:var(--bg); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; transition:opacity 0.5s; }
    #loadingOverlay.hide { opacity:0; pointer-events:none; }
    .loader-ring { width:52px;height:52px; border:3px solid rgba(124,109,250,0.15); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .loader-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.6rem; background:linear-gradient(135deg,var(--accent),var(--accentB)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .loader-text { font-size:0.7rem; color:var(--muted); letter-spacing:3px; text-transform:uppercase; }
    .loader-progress { width:160px;height:2px; background:rgba(124,109,250,0.15); border-radius:2px; overflow:hidden; }
    .loader-bar { height:100%; background:linear-gradient(90deg,var(--accent),var(--accentB)); border-radius:2px; width:0%; transition:width 0.3s; }
    #errorState { display:none; position:fixed; inset:0; background:var(--bg); z-index:40; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:32px; text-align:center; }
    #errorState .err-icon { font-size:52px; }
    #errorState h2 { font-family:'Syne',sans-serif; font-size:1.3rem; }
    #errorState p  { font-size:0.75rem; color:var(--muted); line-height:1.8; max-width:300px; }
    .hint-pill { position:absolute; top:72px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.65); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08); border-radius:50px; padding:8px 18px; font-size:0.68rem; color:var(--muted); white-space:nowrap; pointer-events:none; animation:hintFade 5s forwards; animation-delay:1.5s; opacity:0; }
    @keyframes hintFade { 0%{opacity:0;transform:translateX(-50%) translateY(-6px)} 15%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">AR·VIEWER</div>
  <div class="topbar-name" id="topTitle">Chargement…</div>
</div>

<div id="loadingOverlay">
  <div class="loader-logo">AR·VIEWER</div>
  <div class="loader-ring"></div>
  <div class="loader-text">Chargement du modèle…</div>
  <div class="loader-progress"><div class="loader-bar" id="loaderBar"></div></div>
</div>

<div id="errorState">
  <div class="err-icon">⚠️</div>
  <h2>Modèle introuvable</h2>
  <p>Le fichier GLB demandé n'existe pas ou l'URL est incorrecte.<br>Vérifiez que le modèle est bien dans <code>/public/models/</code></p>
</div>

<model-viewer id="viewer" ar ar-modes="webxr scene-viewer quick-look"
  camera-controls auto-rotate auto-rotate-delay="800" rotation-per-second="18deg"
  environment-image="neutral" shadow-intensity="1.2" shadow-softness="0.9"
  style="display:none;">
  <button slot="ar-button" class="ar-btn"><span>📱</span><span>Voir en Réalité Augmentée</span></button>
  <div class="hint-pill">Glissez pour tourner · Pincez pour zoomer</div>
</model-viewer>

<script>
  const params     = new URLSearchParams(window.location.search);
  const modelParam = params.get("model");
  const titleParam = params.get("title");
  const viewer     = document.getElementById("viewer");
  const overlay    = document.getElementById("loadingOverlay");
  const errState   = document.getElementById("errorState");
  const topTitle   = document.getElementById("topTitle");
  const loaderBar  = document.getElementById("loaderBar");

  function resolveUrl(param) {
    if (!param) return null;
    if (param.startsWith("http://") || param.startsWith("https://")) return param;
    return `/models/${param}`;
  }

  const modelUrl = resolveUrl(modelParam);
  const title = titleParam
    ? decodeURIComponent(titleParam)
    : (modelParam || "").replace(/\.(glb|gltf|usdz)$/i,"").replace(/_/g," ");

  document.title = title ? `${title} — AR Viewer` : "AR Viewer";
  topTitle.textContent = title || "Modèle AR";

  if (!modelUrl) {
    overlay.classList.add("hide");
    errState.style.display = "flex";
  } else {
    const usdzUrl = modelUrl.replace("/models/","/models-usdz/").replace(/\.glb$/i,".usdz");
    viewer.setAttribute("src", modelUrl);
    viewer.setAttribute("ios-src", usdzUrl);
    viewer.setAttribute("alt", title);
    viewer.style.display = "block";

    viewer.addEventListener("progress", e => {
      loaderBar.style.width = Math.round(e.detail.totalProgress * 100) + "%";
    });
    viewer.addEventListener("load", () => {
      loaderBar.style.width = "100%";
      setTimeout(() => overlay.classList.add("hide"), 400);
    });
    viewer.addEventListener("error", () => {
      overlay.classList.add("hide");
      errState.style.display = "flex";
    });
  }
</script>
</body>
</html>
